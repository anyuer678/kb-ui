name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # changeset status 需要与基线分支做 diff，浅克隆下本地没有 master ref 会直接报错
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile


      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Check create-kb templates are in sync with packages/api
        run: pnpm sync:api-template:check

      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Changeset status
        run: pnpm changeset status --since=origin/master

