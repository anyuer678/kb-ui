name: doc-claims

on:
  workflow_dispatch:
  push:
    paths:
      - "README.md"
      - "packages/ui/**"
      - "scripts/check-doc-claims.py"
  pull_request:
    paths:
      - "README.md"
      - "packages/ui/**"
      - "scripts/check-doc-claims.py"

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/check-doc-claims.py
