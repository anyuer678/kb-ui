name: Release

# 手动触发。发布范围（ignore 之外）：kb-ui-vue、@yuer678/kb-utils、@yuer678/kb-api、@yuer678/create-kb；内部包（@kb/config、kb-playground、kb-docs）不发布。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '仅演练：构建并检查，不执行 version / publish'
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 无 token 也构建，保证 release 工作流本身可验证
      - name: Build (all publishable packages)
        run: pnpm build

      - name: Skip notice (NPM_TOKEN not configured)
        if: env.HAS_NPM_TOKEN == 'false'
        run: echo "NPM_TOKEN 未配置：只构建，不发布。Path A 见 docs/PUBLISH.md"

      - name: Check changesets exist
        if: env.HAS_NPM_TOKEN == 'true'
        id: changesets
        run: |
          if ls .changeset/*.md >/dev/null 2>&1 && [ "$(ls .changeset/*.md 2>/dev/null | grep -v README.md | wc -l)" -gt 0 ]; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
            echo "无待发布 changeset，跳过 version/publish"
          fi

      - name: Dry run notice
        if: inputs.dry_run
        run: echo "dry_run=${{ inputs.dry_run }}，默认不执行 version/publish。"

      # token 无效时降级为警告，不把整个 Release 打成失败
      # （仓库 secret 里的 NPM_TOKEN 可能过期/无权限，需人工轮换）
      - name: Verify npm auth
        if: env.HAS_NPM_TOKEN == 'true' && !inputs.dry_run
        id: npm_auth
        continue-on-error: true
        run: |
          set +e
          ACCOUNT=$(npm whoami --registry=https://registry.npmjs.org)
          code=$?
          if [ $code -ne 0 ]; then
            echo "::warning::NPM_TOKEN 无效或无发布权限（whoami 失败）。请在仓库 Secrets 更新 NPM_TOKEN。跳过 publish。"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "npm 账号：${ACCOUNT}"
          echo "ok=true" >> "$GITHUB_OUTPUT"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Version packages
        if: env.HAS_NPM_TOKEN == 'true' && !inputs.dry_run && steps.changesets.outputs.has_changesets == 'true' && steps.npm_auth.outputs.ok == 'true'
        run: pnpm changeset version

      - name: Publish to npm
        if: env.HAS_NPM_TOKEN == 'true' && !inputs.dry_run && steps.changesets.outputs.has_changesets == 'true' && steps.npm_auth.outputs.ok == 'true'
        run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # `changeset tag` + `git push --tags` 在 scoped 包名上出现过静默失灵
      # （run 35989660546：tag 步骤自称 Created，push 却报 Everything up-to-date，远端无 ref）。
      # 改用 Git Data API 显式建 tag，逐个可核验、可重跑；tag 指向触发 commit，
      # 更精确的锚点可在回写 PR 合并后手动重打到该 merge commit（npm 版本才是真源）。
      - name: Create release tags (API)
        if: env.HAS_NPM_TOKEN == 'true' && !inputs.dry_run && steps.changesets.outputs.has_changesets == 'true' && steps.npm_auth.outputs.ok == 'true'
        run: |
          set -euo pipefail
          TAG_SHA="$(git rev-parse HEAD)"
          for PKG_DIR in packages/*; do
            NAME="$(node -p "require('./$PKG_DIR/package.json').name")"
            VERSION="$(node -p "require('./$PKG_DIR/package.json').version")"
            case "$NAME" in
              @kb/config|kb-playground|kb-docs) continue ;;
            esac
            REF="refs/tags/${NAME}@${VERSION}"
            if gh api "repos/${{ github.repository }}/git/matching-refs/tags/${NAME}@${VERSION}" --jq '.[].ref' | grep -qFx "$REF"; then
              echo "tag ${NAME}@${VERSION} 已存在，跳过"
            else
              gh api --method POST "repos/${{ github.repository }}/git/refs" \
                -f "ref=$REF" -f "sha=$TAG_SHA" --jq '.ref'
              echo "created $REF @ $TAG_SHA"
            fi
          done
        env:
          GH_TOKEN: ${{ github.token }}

      # master 有分支保护（required status checks），GITHUB_TOKEN 直接 push 必被 GH006 拒绝
      # → 版本回写改为推到独立分支并自动开 PR，由 required checks 走完再人工/自动合并。
      # 若 repo 未开启「Allow GitHub Actions to create and approve pull requests」，
      # gh pr create 会失败——publish/tag 均已完成，这里降级为警告，
      # 手动从 release/writeback-* 分支开 PR 即可（run 35989660546 的实证流程）。
      - name: Open version write-back PR
        if: env.HAS_NPM_TOKEN == 'true' && !inputs.dry_run && steps.changesets.outputs.has_changesets == 'true' && steps.npm_auth.outputs.ok == 'true'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "无版本变更需要回写"
            exit 0
          fi
          BR="release/writeback-$(date +%Y%m%d%H%M%S)"
          git checkout -b "$BR"
          git add -A
          git commit -m "release: version packages (write-back from run ${{ github.run_id }})"
          git push origin "$BR"
          gh pr create --base "$GITHUB_REF_NAME" --head "$BR" \
            --title "release: version packages (auto write-back)" \
            --body "Automated write-back from Release run ${{ github.run_id }}. npm publish 已由该 run 完成，本 PR 仅同步版本号 / CHANGELOG 与 .changeset 消费状态，使 master 与 registry 一致（防止下次 publish 撞已存在版本）。"
        env:
          GH_TOKEN: ${{ github.token }}
