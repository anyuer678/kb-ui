name: Release

# 手动触发，避免"合并即发版"这种不可逆的外部动作被代码合并顺带引发。
# 发版前建议先确认待发布包在 npm 上的作用域归属（例如 @kb/* 首次发布需要该作用域在账号名下）。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '仅演练：输出将要发布的包，不执行 version / publish'
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Skip notice (NPM_TOKEN not configured)
        if: env.HAS_NPM_TOKEN == 'false'
        run: echo "NPM_TOKEN 未配置，跳过发布。"

      - name: Build (all publishable packages)
        if: env.HAS_NPM_TOKEN == 'true'
        run: pnpm build

      # 仅当存在待发布 changeset 时才执行 version+publish；否则干净通过
      - name: Check changesets exist
        if: env.HAS_NPM_TOKEN == 'true'
        id: changesets
        run: |
          if ls .changeset/*.md >/dev/null 2>&1 && [ "$(ls .changeset/*.md 2>/dev/null | grep -v README.md | wc -l)" -gt 0 ]; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
            echo "无待发布 changeset，跳过 version/publish"
          fi

      - name: Dry run — list pending changesets
        if: env.HAS_NPM_TOKEN == 'true' && inputs.dry_run
        run: |
          echo "待发布的 changeset："
          for f in $(ls .changeset/*.md 2>/dev/null | grep -v 'README.md'); do
            echo "--- $f"
            cat "$f"
          done

      - name: Dry run notice
        if: inputs.dry_run
        run: echo "dry_run=true，未执行 version / publish。"

      # 提前校验 token：无发布权限时 npm registry 对 PUT 只回一个 404，
      # 报在 publish 环节很难定位，whoami 能直接暴露"token 无效/不对账号"
      - name: Verify npm auth
        if: env.HAS_NPM_TOKEN == 'true' && !inputs.dry_run
        run: |
          echo "npm 账号：$(npm whoami --registry=https://registry.npmjs.org)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Version packages
        if: env.HAS_NPM_TOKEN == 'true' && !inputs.dry_run && steps.changesets.outputs.has_changesets == 'true'
        run: pnpm changeset version

      - name: Publish to npm
        if: env.HAS_NPM_TOKEN == 'true' && !inputs.dry_run && steps.changesets.outputs.has_changesets == 'true'
        run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # version 只改工作区文件，不回写仓库的话 npm 上的版本会和仓库里的
      # package.json / CHANGELOG 永久错位，下一次 release 还会重复发同一个版本
      - name: Create git tags
        if: env.HAS_NPM_TOKEN == 'true' && !inputs.dry_run && steps.changesets.outputs.has_changesets == 'true'
        run: pnpm changeset tag

      - name: Commit and push release state
        if: env.HAS_NPM_TOKEN == 'true' && !inputs.dry_run && steps.changesets.outputs.has_changesets == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "无版本变更需要回写"
            exit 0
          fi
          git add -A
          git commit -m "release: version packages"
          git push --follow-tags origin HEAD:${GITHUB_REF_NAME}
