<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>{{projectName}} · AI 工作台</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, sans-serif; background: #f6f7f9; height: 100vh; display: flex; }
.sidebar { width: 200px; background: #1e293b; color: #fff; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.sidebar h2 { font-size: 15px; margin: 0 0 8px; }
.sidebar label { font-size: 12px; color: #94a3b8; }
.sidebar select { width: 100%; padding: 6px; border-radius: 6px; border: none; background: #334155; color: #fff; }
.chat { flex: 1; display: flex; flex-direction: column; }
.messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 70%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
.msg.user { align-self: flex-end; background: #3b82f6; color: #fff; }
.msg.assistant { align-self: flex-start; background: #fff; border: 1px solid #e2e8f0; }
.inputbar { display: flex; gap: 8px; padding: 12px 16px; background: #fff; border-top: 1px solid #e2e8f0; }
.inputbar textarea { flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; resize: none; font-family: inherit; }
.inputbar button { padding: 10px 20px; border: none; border-radius: 8px; background: #3b82f6; color: #fff; cursor: pointer; }
.inputbar button:disabled { opacity: 0.5; }
</style>
</head>
<body>
<aside class="sidebar">
  <h2>{{projectName}}</h2>
  <label>模型</label>
  <select id="model">
    <option value="gpt-4o-mini">GPT-4o mini</option>
    <option value="gpt-4o">GPT-4o</option>
    <option value="deepseek-chat">DeepSeek Chat</option>
    <option value="deepseek-reasoner">DeepSeek Reasoner</option>
    <option value="llama3.1">本地 Ollama</option>
  </select>
  <label>温度</label>
  <input id="temp" type="range" min="0" max="2" step="0.1" value="0.7" />
</aside>
<main class="chat">
  <div class="messages" id="messages">
    <div class="msg assistant">你好！我是 AI 工作台演示，输入问题开始对话（流式输出）。</div>
  </div>
  <div class="inputbar">
    <textarea id="input" rows="1" placeholder="输入消息…（Enter 发送，Shift+Enter 换行）"></textarea>
    <button id="send">发送</button>
  </div>
</main>
<script>
const messagesEl = document.getElementById('messages')
const inputEl = document.getElementById('input')
const sendEl = document.getElementById('send')
const modelEl = document.getElementById('model')
const tempEl = document.getElementById('temp')

const history = []
function addMessage(role, content) {
  const el = document.createElement('div')
  el.className = `msg ${role}`
  el.textContent = content
  messagesEl.appendChild(el)
  messagesEl.scrollTop = messagesEl.scrollHeight
  return el
}

async function send() {
  const text = inputEl.value.trim()
  if (!text) return
  inputEl.value = ''
  history.push({ role: 'user', content: text })
  addMessage('user', text)
  const assistant = addMessage('assistant', '')
  sendEl.disabled = true

  try {
    const res = await fetch('/chat/stream', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ messages: history, model: modelEl.value, temperature: Number(tempEl.value) }),
    })
    const reader = res.body.getReader()
    const decoder = new TextDecoder()
    let buffer = ''
    let full = ''
    while (true) {
      const { done, value } = await reader.read()
      if (done) break
      buffer += decoder.decode(value, { stream: true })
      const lines = buffer.split('\n\n')
      buffer = lines.pop() || ''
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue
        const payload = line.slice(6)
        if (payload === '[DONE]') continue
        const data = JSON.parse(payload)
        if (data.error) { assistant.textContent = `⚠ ${data.error}`; continue }
        full += data.delta
        assistant.textContent = full
        messagesEl.scrollTop = messagesEl.scrollHeight
      }
    }
    history.push({ role: 'assistant', content: full })
  } catch {
    assistant.textContent = '⚠ 请求失败，请确认后端已启动且 .env 配置正确'
  } finally {
    sendEl.disabled = false
  }
}

sendEl.addEventListener('click', send)
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault()
    send()
  }
})
</script>
</body>
</html>
